name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-windows:
    name: Windows x64 self-contained
    runs-on: windows-latest
    env:
      PROJECT: Squad-pipeline-map-data-CUE4Parse/Squad-pipeline-map-data-CUE4Parse.csproj
      PUBLISH_DIR: artifacts/SquadPipeline-win-x64

    steps:
      - name: Checkout sources and CUE4Parse
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore $env:PROJECT --runtime win-x64

      - name: Publish self-contained application
        run: >-
          dotnet publish $env:PROJECT
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output $env:PUBLISH_DIR
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create release archive
        id: archive
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.tag }}'
          } else {
            '${{ github.ref_name }}'
          }
          $safeTag = $tag.Replace('/', '-')
          $archive = "artifacts/SquadPipeline-$safeTag-win-x64.zip"
          Compress-Archive -Path "$env:PUBLISH_DIR/*" -DestinationPath $archive -CompressionLevel Optimal
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "safe_tag=$safeTag" >> $env:GITHUB_OUTPUT
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SquadPipeline-${{ steps.archive.outputs.safe_tag }}-win-x64
          path: ${{ steps.archive.outputs.archive }}
          if-no-files-found: error

      - name: Create GitHub release if needed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.archive.outputs.tag }}'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target '${{ github.sha }}' --title "Squad Pipeline $tag" --generate-notes
          }

      - name: Attach archive to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ steps.archive.outputs.tag }}' '${{ steps.archive.outputs.archive }}' --clobber
